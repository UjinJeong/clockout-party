# Render "Blueprint": New → Blueprint → pick this repository. The free plan sleeps
# after 15 minutes with no visitors and wakes in about a minute on the next visit.
services:
  - type: web
    name: clockout-party
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        generateValue: true
      # 🖼️ the manager page's 전시장 tab saves to this repository. A fine-grained token with
      # "Contents: Read and write" on this repository only; entered in the Render dashboard.
      - key: GITHUB_TOKEN
        sync: false
      # 📝❤️ the guest book and the hearts on paintings are kept in the Key Value below, so a
      # redeploy or a sleep doesn't wipe them (without it they live in memory only)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: clockout-party-kv
          property: connectionString

  # Free Key Value (Redis-compatible). Reachable only from Render services in the same region.
  # The free plan keeps data in memory (no disk backup), so a rare restart of this instance clears it.
  - type: keyvalue
    name: clockout-party-kv
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []
